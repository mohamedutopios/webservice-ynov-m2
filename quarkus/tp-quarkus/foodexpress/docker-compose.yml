version: '3.8'

services:
  postgres-customer:
    image: postgres:16-alpine
    container_name: pg-customer
    environment:
      POSTGRES_DB: customerdb
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer
    ports:
      - "5441:5432"
    volumes:
      - pg_customer_data:/var/lib/postgresql/data

  postgres-restaurant:
    image: postgres:16-alpine
    container_name: pg-restaurant
    environment:
      POSTGRES_DB: restaurantdb
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
    ports:
      - "5442:5432"
    volumes:
      - pg_restaurant_data:/var/lib/postgresql/data

  postgres-order:
    image: postgres:16-alpine
    container_name: pg-order
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    ports:
      - "5443:5432"
    volumes:
      - pg_order_data:/var/lib/postgresql/data

  postgres-delivery:
    image: postgres:16-alpine
    container_name: pg-delivery
    environment:
      POSTGRES_DB: deliverydb
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
    ports:
      - "5444:5432"
    volumes:
      - pg_delivery_data:/var/lib/postgresql/data

volumes:
  pg_customer_data:
  pg_restaurant_data:
  pg_order_data:
  pg_delivery_data:
