
# --- Fix IPv6 macOS ---
quarkus.http.host=0.0.0.0

# ============================================================
# CONFIG APP
# ============================================================
app.name=TaskManager-Secured
app.version=7.0
app.description=API sécurisée JWT + Keycloak
app.enable-search=true
app.pagination.default-size=10
app.pagination.max-size=100

# ============================================================
# DATABASE — Dev Services PostgreSQL
# ============================================================
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.sql-load-script=import.sql

# ============================================================
# OPENAPI / SWAGGER UI
# ============================================================
quarkus.smallrye-openapi.info-title=TaskManager API (Secured)
quarkus.smallrye-openapi.info-version=7.0
quarkus.smallrye-openapi.info-description=API REST sécurisée par JWT + Keycloak
quarkus.swagger-ui.always-include=true

# ============================================================
# OIDC / KEYCLOAK — Configuration
# ============================================================
# URL du serveur Keycloak (realm "taskmanager")
quarkus.oidc.auth-server-url=http://localhost:8180/realms/taskmanager

# Client ID configuré dans Keycloak
quarkus.oidc.client-id=task-api

# Type : "service" = vérification du token JWT (Resource Server)
# Quarkus ne gère PAS le login — il vérifie juste le token
quarkus.oidc.application-type=service

# Mapping des rôles : lire les rôles depuis realm_access.roles du JWT
# (emplacement par défaut de Keycloak)
quarkus.oidc.roles.role-claim-path=realm_access/roles

# ============================================================
# CORS — pour les appels front-end / Swagger UI
# ============================================================
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
