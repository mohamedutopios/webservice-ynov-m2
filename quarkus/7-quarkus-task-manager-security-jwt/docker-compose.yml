
services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      # Identifiants admin Keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Port HTTP (8180 pour ne pas conflicter avec Quarkus 8080)
      KC_HTTP_PORT: 8180
    ports:
      - "8180:8180"
    volumes:
      # Import automatique du realm précconfiguré
      - ./keycloak/taskmanager-realm.json:/opt/keycloak/data/import/taskmanager-realm.json:ro
